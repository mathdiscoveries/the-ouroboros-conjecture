    id: "https://doi.org/10.4064/aa-30-3-241-252"
    type: paper
    location: "Acta Arithmetica 30(3) (1976), 241-252"
    relationship: background
    note: >-
      Read in full (pp. 241-252). Parity-word coding and density-one stopping
      time method for the classical 3x+1 map; precedent for our base-10 coding
      and exponential descent bound.
  - title: "A generalization of Hasse's generalization of the Syracuse algorithm"
    authors:
      - "K. R. Matthews"
      - "A. M. Watts"
    id: "https://doi.org/10.4064/aa-43-2-167-175"
    type: paper
    location: "Acta Arithmetica 43(2) (1984), 167-175"
    relationship: background
    note: >-
      Read in full (pp. 167-175). Congruence-cylinder coding for generalized
      Syracuse mappings under coprime-multiplier hypotheses.
  - title: "A Markov process underlying the generalized Syracuse algorithm"
    authors:
      - "G. M. Leigh"
    id: "https://doi.org/10.4064/aa-46-2-125-143"
    type: paper
    location: "Acta Arithmetica 46(2) (1986), 125-143"
    relationship: background
    note: >-
      Read in full (pp. 125-143). Residue-tracking Markov chains when
      multipliers share factors with the modulus.
  - title: "Bounds for the 3x+1 problem using difference inequalities"
    authors:
      - "Ilia Krasikov"
      - "Jeffrey C. Lagarias"
    id: "https://doi.org/10.4064/aa109-3-4"
    type: paper
    location: "Acta Arithmetica 109(3) (2003), 237-258"
    relationship: background
    note: >-
      Read in full (pp. 237-258). Inverse-orbit difference inequalities for
      3x+1 motivating our weighted backward-tree bounds for the basin of 5.
  - title: "On the (non-)existence of m-cycles for generalized Syracuse sequences"
    authors:
      - "John L. Simons"
    id: "https://doi.org/10.4064/aa131-3-2"
    type: paper
    location: "Acta Arithmetica 131(3) (2008), 217-254"
    relationship: background
    note: >-
      Read in full (pp. 217-254). Logarithmic linear-form obstructions to
      nontrivial cycles of generalized Syracuse maps.
  - title: "An automated approach to the Collatz conjecture"
    authors:
      - "Emre Yolcu"
      - "Scott Aaronson"
      - "Marijn J. H. Heule"
    id: "https://doi.org/10.1007/s10817-022-09658-8"
    type: paper
    location: "Journal of Automated Reasoning 67 (2023), article 15"
    relationship: background
    note: >-
      Section 4.2 read. Uses the affine change of variables n = 2y + 1 to
      conjugate Farkas's variant to a modified shortcut; parallels our direct
      base-4 conjugacy proof.
  - title: "A Collatz-type dynamical system with alternating multipliers (3 and 5): three attractors and huge excursions"
    authors:
      - "Augusto Santi"
    id: "https://math.stackexchange.com/q/5113307"
    type: other
    location: "Mathematics Stack Exchange, 10 December 2025"
    relationship: background
    note: >-
      Original post read. Records the six-cycle 5 -> 26 -> 13 -> 40 -> 20 ->
      10 -> 5 under a different rule alternating multipliers 3 and 5 without
      reading a decimal digit.

related_formalizations: []

status:
  scope: >-
    Unconditionally proved in Lean 4 (v4.35.0) + Mathlib with standard axioms
    only (zero sorry, zero native_decide; 16 library modules in Ouroboros/ plus
    Challenge and Solution import Mathlib while the 16 finite certificate
    shards use Init-only kernel reduction): 35 compared theorems covering
    base-4 Collatz equivalence and bases 2 and 5, base-10 exponential Terras
    descent (p_k <= 1.124953 * 0.996423^k) and density-one descent, complete
    all-even-base stopping-time dichotomy (p_infty(b) = 0 iff b in {2, 4, 6, 10}),
    base-10 basin-of-1 modulo-30 residue law, exact 2-adic Cantor closure and
    ultrametric isometry onto Sigma and 000 Sigma u 001 Sigma, positive finite
    Hausdorff measure and exact dim_H = dim_B = beta = -log_2 a, elementary
    quartic bounds a_1^9 X^gamma <= N_1(floor X) <= X^beta, and density zero,
    individual child-weight tree charging and unconditional basin-of-5 lower
    bound N_5(X) > 0.02134 * X^(13/20) (Q = 14175 QuadTree kernel certificate)
    with strict asymptotic separation N_1(X)/N_5(X) -> 0, complete even-base
    drift sign classification, near-zero band classification, and logarithmic
    drift growth, odd-base runaway divergence, rootless trapdoor density 1/b,
    and base-17 certified divergence, base-10 cycle digit-cancellation,
    halving-budget, K > 64000 tail, and unconditional m <= 3 odd-cycle
    classification, and complete congruence-class completions and exact base-b
    suffix-closure Hausdorff and box-counting dimension (log u + t log lambda)/log b
    in every base b >= 2. Main results in the companion paper: 13 of 16 proved
    main results in Lean 4 (81%) · 3 of 16 by external computation (sharpened
    N_1 bounds, cycles through 10^15, and 905/999 odd-base absorption survey;
    the sharpened N_5 bound of Theorem 8 Part 2 is verified in Lean 4) · Global
    conjecture open.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]

