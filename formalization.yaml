    and not proved. Main results in the companion paper: 13 of 16 proved main
    results in Lean 4 (81%) · 3 of 16 by external computation (sharpened N_1
    bounds, cycles through 10^15, and 905/999 odd-base absorption survey; the
    sharpened N_5 bound of Theorem 8 Part 2 is verified in Lean 4) · Global
    conjecture open.

