alignment:
  namespace: "OuroborosChallenge"
  statements:
    - source: "Base-4 conjugacy: 2y+1 reaches 3 under f_4 iff y reaches 1 under T_C"
      lean: "OuroborosChallenge.prop_base4_reaches_three_iff"
      module: "Challenge"
      status: proved
      note: "Exact equivalence for every natural number y."
    - source: "Base-4 universal attraction to {1, 3} is equivalent to the Collatz conjecture"
      lean: "OuroborosChallenge.prop_base4_iff_collatz"
      module: "Challenge"
      status: proved
      note: "Unconditional equivalence with universal T_C attraction on positive integers."
    - source: "Base 2 universal attraction to 1"
      lean: "OuroborosChallenge.prop_base2_reaches_one"
      module: "Challenge"
      status: proved
      note: "Every positive integer reaches 1 under f_2."
    - source: "Base 5 universal attraction to 1"
      lean: "OuroborosChallenge.prop_base5_reaches_one"
      module: "Challenge"
      status: proved
      note: "Every positive integer reaches 1 under f_5."
    - source: "Quantitative exponential Terras descent in base 10"
      lean: "OuroborosChallenge.thm_terras_bound"
      module: "Challenge"
      status: proved
      note: "Upper density of E_k is at most 1.124953 * (0.996423)^k."
    - source: "Natural density-one descent in base 10"
      lean: "OuroborosChallenge.thm_terras_density_one"
      module: "Challenge"
      status: proved
      note: "The non-descending set NoDescent has natural density 0."
    - source: "Modulo-30 residue law for the base-10 basin of 1"
      lean: "OuroborosChallenge.thm_residue_law"
      module: "Challenge"
      status: proved
      note: "Every odd n reaching 1 satisfies n mod 30 in {1, 15, 17}."
    - source: "Basin-of-1 lower power-law bound"
      lean: "OuroborosChallenge.thm_basin1_lower"
      module: "Challenge"
      status: proved
      note: "N1(X) >= c * X^(log_2(1/a1)) where a1 + a1^4 = 1, 0 < a1 < 1."
    - source: "Explicit basin-of-1 upper power-law bound"
      lean: "OuroborosChallenge.thm_basin1_upper_explicit"
      module: "Challenge"
      status: proved
      note: "N1(X) <= 2.44 * X^0.626383 for every X >= 1."
    - source: "Basin of 1 has natural density zero"
      lean: "OuroborosChallenge.thm_basin1_density_zero"
      module: "Challenge"
      status: proved
      note: "N1All(X) / X -> 0 as X -> infinity."
    - source: "Unconditional basin-of-5 lower bound (Q = 14175 kernel certificate)"
      lean: "OuroborosChallenge.thm_basin5_tight"
      module: "Challenge"
      status: proved
      note: "N5(X) >= 0.000605 * X^0.65 for every X >= 3 via Init-only QuadTree shards."
    - source: "Unconditional explicit basin separation bound"
      lean: "OuroborosChallenge.cor_basin_separation_unconditional"
      module: "Challenge"
      status: proved
      note: "N1(X) / N5(X) <= (2.44 / 1.0766e-4) * X^(-0.0236) for every X >= 3."
    - source: "Strict asymptotic basin separation N1(X)/N5(X) -> 0"
      lean: "OuroborosChallenge.cor_basin_separation_tendsto_zero_unconditional"
      module: "Challenge"
      status: proved
      note: "Both odd and all-integer basin ratios tend to 0 unconditionally."
    - source: "Complete even-base stationary drift sign classification"
      lean: "OuroborosChallenge.thm_even_bases"
      module: "Challenge"
      status: proved
      note: "Nonpositive stationary drift exists iff b in {2, 4, 6, 10}."
    - source: "Near-zero drift band classification across all even bases"
      lean: "OuroborosChallenge.prop_near_zero_band"
      module: "Challenge"
      status: proved
      note: "|drift| <= 1/4 iff b in {4, 8, 10, 14}; drift in [-1/4, 0) iff b in {4, 10}."
    - source: "Universal logarithmic drift growth across even bases"
      lean: "OuroborosChallenge.cor_drift_growth"
      module: "Challenge"
      status: proved
      note: "Every stationary drift in even base b >= 2 is >= (1/2) ln(b+2) - (7/2) ln 2."
    - source: "Odd-base even-digit runaway divergence theorem"
      lean: "OuroborosChallenge.prop_odd_runaway"
      module: "Challenge"
      status: proved
      note: "Closed nonzero even-digit residue set S yields exponential divergence >= 2^k * n."
    - source: "Rootless odd-base trapdoor characterization"
      lean: "OuroborosChallenge.thm_odd_trapdoor_rootless"
      module: "Challenge"
      status: proved
      note: "If prime p = 3 (mod 4) divides odd b, ZSet b consists precisely of positive multiples of b."
    - source: "Certified base-17 runaway divergence"
      lean: "OuroborosChallenge.lem_base17_runaway"
      module: "Challenge"
      status: proved
      note: "Every odd n = 16 (mod 17) diverges to infinity with strict 10-step growth."
    - source: "Exact trapdoor density 1/b for rootless odd bases"
      lean: "OuroborosChallenge.thm_odd_densities_rootless"
      module: "Challenge"
      status: proved
      note: "countFrac (ZSet b) N -> 1/b when prime p = 3 (mod 4) divides odd b >= 3."
    - source: "Exact digit-count cancellation law n_5 = n_3 + n_7"
      lean: "OuroborosChallenge.cycle_n5_eq_n3_add_n7"
      module: "Challenge"
      status: proved
      note: "Holds for every base-10 odd cycle of any length m >= 1."
    - source: "Halving-budget lower bounds for base-10 odd cycles"
      lean: "OuroborosChallenge.lem_halving_budget"
      module: "Challenge"
      status: proved
      note: "Both linear and prime-factor halving lower bounds for every OddCycle m."
    - source: "High-halving cycle tail bound at threshold 10^15"
      lean: "OuroborosChallenge.thm_cycle_tail_64000"
      module: "Challenge"
      status: proved
      note: "Minimum >= 10^15 and K > 64000 force m >= 20190 and K + m >= 84191."
    - source: "Unconditional uniqueness of 1-odd-member base-10 cycles"
      lean: "OuroborosChallenge.cycle_m1_unique"
      module: "Challenge"
      status: proved
      note: "Only the 1 -> 2 -> 1 cycle has m = 1 odd member."
    - source: "Unconditional classification of 2-odd-member base-10 cycles"
      lean: "OuroborosChallenge.cycle_m2_classification"
      module: "Challenge"
      status: proved
      note: "Only repeated {1} and {5, 13} have m = 2 odd members."
    - source: "Unconditional uniqueness of 3-odd-member base-10 cycles"
      lean: "OuroborosChallenge.cycle_m3_unique"
      module: "Challenge"
      status: proved
      note: "No further cycle has m = 3 odd members."
    - source: "Non-vacuity check: 1 -> 2 -> 1 cycle"
      lean: "OuroborosChallenge.f_cycle_one"
      module: "Challenge"
      status: proved
      note: "Confirms f^[2] 1 = 1."
    - source: "Non-vacuity check: 5 -> 26 -> 13 -> 40 -> 20 -> 10 -> 5 cycle"
      lean: "OuroborosChallenge.f_cycle_five"
      module: "Challenge"
      status: proved
      note: "Confirms f^[6] 5 = 5."
    - source: "Individual child-weight charging inequality on the inverse tree of 3 (Lemma 20)"
      lean: "OuroborosChallenge.lem_weighted_tree3"
      module: "Challenge"
      status: proved
      note: "Establishes (X / o)^s * w(t) <= L * NTree(o, X) from expansion and row-sum budget."
    - source: "Improved unconditional basin-of-5 lower bound via child-weight charging (Theorem 8, Part 2)"
      lean: "OuroborosChallenge.thm_basin5_sharp"
      module: "Challenge"
      status: proved
      note: "N5(X) >= (98959 / (2269527 * 3^(13/20))) * X^(13/20) for every X >= 3."
    - source: "Explicit decimal basin-of-5 lower bound N5(X) > 0.02134 * X^(13/20)"
      lean: "OuroborosChallenge.thm_basin5_sharp_gt"
      module: "Challenge"
      status: proved
      note: "Holds unconditionally for every integer X >= 3 via pure-kernel row-sum cap."
    - source: "Complete all-even-base non-descent stopping dichotomy (Theorem 11)"
      lean: "OuroborosChallenge.thm_even_stopping"
      module: "Challenge"
      status: proved
      note: "Exact densities p_k(b) -> p_infty(b) with p_infty(b) = 0 iff b in {2, 4, 6, 10}."
    - source: "Exact 2-adic Cantor closure, ultrametric isometry, Hausdorff/box dimension, and elementary bounds (Theorem 18)"
      lean: "OuroborosChallenge.thm_cantor"
      module: "Challenge"
      status: proved
      note: "2-adic closure of B_1, isometry onto Sigma / 000 Sigma u 001 Sigma, dim_H = dim_B = beta, and a_1^9 X^gamma <= N_1(floor X) <= X^beta."
    - source: "Congruence-class completion dichotomy for B_5 and B_1 (Theorem 29)"
      lean: "OuroborosChallenge.thm_suffix_class"
      module: "Challenge"
      status: proved
      note: "Every a mod m has infinitely many members of B_5; exact live-residue criterion mod 30 * 2^h for B_1."
    - source: "Exact Hausdorff and box-counting dimension of reversed base-b suffix closures (Corollary 30)"
      lean: "OuroborosChallenge.cor_suffix_dimension"
      module: "Challenge"
      status: proved
      note: "dim_H = dim_B = (log u + t log lambda) / log b for B_1 in base b = 2^t u; 8-d.p. values in bases 2, 10, 7; full interval [0, 1] for B_5."

acknowledgements: "Built on Lean 4 and Mathlib."
