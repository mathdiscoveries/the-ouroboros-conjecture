# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "The Ouroboros Conjecture: Competing Attractors in Base 10 Among Last-Digit Collatz Maps Across Many Bases"
  description: >-
    Lean 4 (v4.35.0) + Mathlib formalization of the base-b last-digit Collatz
    family f_b(n) = n/2 (even n) and (n mod b)*n + 1 (odd n), focusing on the
    base-10 Ouroboros map f = f_10 and stating the open OuroborosConjecture
    definition alongside 35 unconditionally proved compared theorems (zero sorry,
    zero native_decide, standard axioms only). Main results in the companion
    paper: 13 of 16 proved main results in Lean 4 (81%) · 3 of 16 by external
    computation (sharpened N_1 bounds, cycles through 10^15, and 905/999
    odd-base absorption survey; the sharpened N_5 bound of Theorem 8 Part 2 is
    verified in Lean 4) · Global conjecture open. Within this package, 16
    library modules in Ouroboros/ (plus Challenge.lean and Solution.lean)
    import Mathlib while the 16 finite certificate shards (BasinFiveCertData,
    BasinFiveCert00..13, and EvenBasesCert) verify finite integer inequalities
    by Init-only kernel reduction (rfl). Companion working paper, exact
    external checkers, and logged prior-work searches are published at
    https://mathdiscoveries.org/results/last-digit-collatz.
  authors:
    - "Tyler B. Hughes"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Tyler B. Hughes"

classification:
  arxiv: ["math.NT", "math.DS"]
  msc2020: ["11B83", "37P99", "60J10"]

sources:
  - title: "The Ouroboros Conjecture: Competing Attractors in Base 10 Among Last-Digit Collatz Maps Across Many Bases"
    authors:
      - "Tyler B. Hughes"
    id: "https://mathdiscoveries.org/results/last-digit-collatz"
    type: original-proof
    location: "Companion page, working paper, verification archives, and prior-work search log at https://mathdiscoveries.org/results/last-digit-collatz"
    relationship: other
    author_endorsement: participated
    note: >-
      Discovery of the base-10 Ouroboros map, all proofs, Lean 4 + Mathlib
      formalization, and internal adversarial reviews were produced by AI
      research agents built and directed by Tyler B. Hughes. Logged prior-work
      searches through 2026-11-22 did not find the last-digit rule or the
      base-10 two-loop conjecture; Guy's Unsolved Problems in Number Theory
      (print) and Wirsching's monograph remain to be searched. No human
